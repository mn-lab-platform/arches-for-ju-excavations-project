services:

  arches_db:
    container_name: arches_db
    image: postgis/postgis:14-3.2
    env_file:
      - ./.env
    environment:
      - PGUSER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgis
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis,postgis_topology
    restart: unless-stopped
    volumes:
        - postgres-data:/var/lib/postgresql/data/
        - postgres-log:/var/log/postgresql
        - ./init-unix.sql:/docker-entrypoint-initdb.d/init.sql # to set up the DB template
        - ../arches_data/:/arches_data
    ports:
      - '5434:5432'
    logging:
      driver: "json-file"
      options:
        max-size: "10k"
        max-file: "10"
    networks:
      - arches_for_excavation_net

  arches_elasticsearch:
    container_name: arches_elasticsearch
    image: elasticsearch:8.5.3
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - TZ="${TZ}"
      - xpack.security.enabled=false
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms400m -Xmx400m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9202:9200"
      - "9302:9300"
    logging:
      driver: "json-file"
      options:
        max-size: "10k"
        max-file: "10"
    networks:
      - arches_for_excavation_net

  arches_redis:
    container_name: arches_redis
    image: "redis:6-alpine"
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - "redisdata:/data"
    command: "redis-server"
    logging:
      driver: "json-file"
      options:
        max-size: "10k"
        max-file: "10"
    networks:
      - arches_for_excavation_net

  arches:
    container_name: arches
    image: arches
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: arches/Dockerfile
      args:
        ARCHES_PROJECT: ${ARCHES_PROJECT}
        ARCHES_ROOT: ${ARCHES_ROOT}
        APP_ROOT: ${APP_ROOT}
        APP_COMP_FOLDER: ${APP_COMP_FOLDER}
        UPLOADED_FILES_FOLDER: ${UPLOADED_FILES_FOLDER}
    restart: unless-stopped
    environment:
      - DEBUG="${DJANGO_DEBUG}"
      - ARCHES_PROJECT=${ARCHES_PROJECT}
    stdin_open: true
    tty: true
    ports:
      - 5432:5432
      - 8000:8000
      - 5678:5678
      - 5984:5984
    depends_on:
      - arches_db
      - arches_elasticsearch
      - arches_redis
    command:
      - run_arches
    volumes:
      - arches-log:/web_root/logs
      - arches-static:/static_root
      - uploads:/arches_app/${ARCHES_PROJECT}/${ARCHES_PROJECT}/uploadedfiles
      - ../arches_data/:/arches_data
      # - ../arches-for-excavation-application/arches_for_excavation:/opt/venv/lib/python3.13/site-packages/arches_for_excavation
    networks:
      - arches_for_excavation_net

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT}:80"
    volumes:  
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - arches-static:/static_root:ro
      - uploads:/media_root/uploadedfiles:ro                        
    depends_on:
      - arches
    networks:
      - arches_for_excavation_net

  titiler:
    container_name: titiler
    build:
      context: .
      dockerfile: titiler/Dockerfile
    image: titiler-iiif:latest
    restart: unless-stopped
    ports:
      - "8081:8000"
    volumes:
      - uploads:/data:ro
    networks:
      - arches_for_excavation_net
    environment:
      - TITILER_ALLOW_LOCAL=true

  cron:
    container_name: arches_cron
    build:
      context: .
      dockerfile: cron/Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/workdir
      - ../arches_data:/arches_data
      - /mnt/storage/arches/arches_data/backups:/mnt/storage/arches/arches_data/backups      
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - arches
      - arches_db
    networks:
      - arches_for_excavation_net

networks:
  arches_for_excavation_net:
    driver: bridge
    name: arches_for_excavation_net

volumes:
  redisdata:
  couchdb-data:
  couchdb-log:
  postgres-data:
  postgres-log:
  elasticsearch-data:
  arches-log:
  arches-static:
  arches-app:
  uploads: